[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrofoil-designer"
version = "0.2.0"
description = "Traceable preliminary sizing tools for hydrofoil boats"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "hydrofoil-designer contributors" },
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
